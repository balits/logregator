[package]
name = "logregator-tsdb"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { version = "1", optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = "2.0.18"
zerocopy = {version = "0.8.52", features = ["derive"] }
crossbeam-skiplist = { version = "0.1.3", optional = true }
tempfile = "3.27.0"

[features]
bytes-buffer = ["dep:bytes"]
crossbeam-skiplist = ["dep:crossbeam-skiplist"]
