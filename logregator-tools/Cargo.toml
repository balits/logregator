[package]
name = "logregator-tools"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
bench = false

[[bin]]
name = "cmp"
path = "src/bin/cmp.rs"
bench = false

[[bin]]
name = "desc"
path = "src/bin/desc.rs"
bench = false

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"
bench = false

[dependencies]
logregator-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
hdrhistogram = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10.1"
owo-colors = "4.3.0"
toml = "0.8"
