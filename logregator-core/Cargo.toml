[package]
name = "logregator-core"
version = "0.1.0"
edition = "2024"

[[bench]]
name = "codec_bench"
harness = false
[[bench]]
name = "engine_bench"
harness = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hdrhistogram = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bytes = "1.10"
socket2 = "0.5"
tokio-util = {version = "0.7", features = ["codec"]}
tokio-stream = "0.1.18"
futures = "0.3.32"

[dev-dependencies]
tempfile = "3.27.0"
criterion = {version = "0.8.2", features = ["html_reports"]}
