# [package]
# name = "logregator"
# version = "0.1.0"
# edition = "2024"

[workspace]
members = ["logregator-core", "logregatord", "logregator-tsdb", "logregator-tools", "xtask"]
resolver = "3"

[workspace.dependencies]
logregator-core = { path = "logregator-core" }
logregator-tools = { path = "logregator-tools" }
logregator-tsdb = { path = "logregator-tsdb" }
anyhow = "1.0.102"
bytes = "1"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
hdrhistogram = "7.5.4"
tokio = {version = "1.52.3", features = ["full"]}
tracing = { version = "0.1", features = ["attributes"] }

[profile.release]
debug = true

[profile.dev]
codegen-units = 256
debug = 1
