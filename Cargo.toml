# [package]
# name = "logregator"
# version = "0.1.0"
# edition = "2024"

[workspace]
# members = ["logregator-core", "logregatord", "logregator-tsdb", "logregator-tools", "xtask", "logregator-net"]
members = [ "logregator-tsdb", "logregator-net"]
resolver = "3"

[workspace.dependencies]
logregator-tsdb = { path = "logregator-tsdb" }
# logregator-core = { path = "logregator-core" }
# logregator-tools = { path = "logregator-tools" }
# logregator-net = { path = "logregator-net" }
# anyhow = "1.0.102"
# clap = { version = "4.6.1", features = ["derive"] }
# hdrhistogram = "7.5.4"
bytes = "1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
tokio = {version = "1.52.3", features = ["full"]}
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = "0.3"
tempfile = "3.27"
thiserror = "2.0.18"
nom = "8.0.0"

[profile.release]
debug = true

[profile.dev]
codegen-units = 256
debug = 1
